seed: 42
device: cuda:0
num_steps_per_env: 48
max_iterations: 300
empirical_normalization: {}
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: 4.0
check_for_nan: true
save_interval: 50
experiment_name: infantry_rl_recovery
run_name: recovery_warm_v1
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: .*
load_checkpoint: logs\rsl_rl\infantry_rl_teleop\2026-10-25_23-01-53_teleop_creep_s2\model_11344.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 128
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.5
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 128
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 8
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.995
  lam: 0.95
  entropy_coef: 0.003
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
