seed: 17
device: cuda:0
num_steps_per_env: 48
max_iterations: 1500
empirical_normalization: false
obs_groups:
  actor:
  - policy
  critic:
  - policy
clip_actions: 8.0
check_for_nan: true
save_interval: 50
experiment_name: chassis_rl_stand_up
run_name: stage2_height_027
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: .*
load_checkpoint: logs\rsl_rl\chassis_rl_stand_up\2026-11-07_09-35-28_stage2_height\model_3400.pt
class_name: OnPolicyRunner
actor:
  class_name: MLPModel
  hidden_dims:
  - 128
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.8
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 128
  - 128
  - 64
  activation: elu
  obs_normalization: true
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
